# CMS configuration. GitHub collaborators with write access can edit repository content.
backend:
  name: github
  repo: Derek-Nichols/dyc-jsc
  branch: main
  auth_methods: [oauth]
  base_url: https://sveltia-cms-auth.nicholsholmes-dn.workers.dev
media_folder: assets/uploads
public_folder: /assets/uploads
collections:
  - name: board
    label: Board Members (Pilot)
    label_singular: Board Member
    folder: content/board
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Position (English), name: position_en, widget: string }
      - { label: Position (French), name: position_fr, widget: string }
      - { label: Photo, name: photo, widget: image, required: false }
      - { label: Image description, name: alt, widget: string, required: false }
      - { label: Display order, name: order, widget: number, value_type: int, default: 1 }
      - { label: Visible, name: visible, widget: boolean, default: true }

  - name: pages
    label: Website Pages
    files:
      - name: index
        label: Homepage
        file: content/pages/index.json
        fields:
          - label: Bilingual text
            name: sections
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { label: Section key, name: key, widget: hidden }
              - { label: Section, name: label, widget: string, required: false }
              - { label: English, name: en, widget: text }
              - { label: French, name: fr, widget: text }
